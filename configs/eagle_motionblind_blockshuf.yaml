# Block-shuffle decoding on MotionBlind physics — sibling-quality arm.
# PERTURBED arm: identical to the MotionBlind calibration recipe (uniform k24, native, timestamps on, task yesno,
# first-token yes/no logit masses logged) plus eval.perturb: blockshuffle — splits the selected frames
# into 4 consecutive blocks and permutes the blocks (within-block order kept), keeping content and
# ascending timestamps, so local motion survives but macro order is scrambled. The mildest order
# perturbation of the three arms. Order-invariant physics (force/speed/magnitude) should barely move
# (floor falls back to native); order-sensitive categories may move. The REAL arm is an
# unperturbed run of eagle_motionblind_calib.yaml. Decode offline with
# scripts/mb_reverse_decode.py (pure-difference + plausibility-floor, per category + overall).
#

experiment:
  type: contrastive-decoding
  technique: video-perturbation-blockshuffle

model:
  kind: eagle
  checkpoint: nvidia/Eagle2.5-8B
  attn_implementation: sdpa

dataset:
  kind: motionblind
  root: /path/to/datasets/motionblind
  annotations: data_db.jsonl

video:
  frame_source: uniform
  candidates: 32
  top_k: 24
  candidate_resize: null
  max_dynamic_tiles: 1
  pass_timestamps: true

prompt:
  task: yesno

generation:
  max_new_tokens: 8
  do_sample: false

eval:
  seed: 1234
  sample_timeout_s: 300
  results_dir: ../results
  log_yesno_logits: true
  perturb:
    mode: blockshuffle     # permute 4 consecutive blocks; within-block order kept, timestamps ascending
    blocks: 4
    seed: 1234

wandb:
  project: vlm-benchmark
  group: contrastive-decoding
  name: eagle-mbblk-pert
  log_every: 20
