# Block-shuffle arm of the sibling-quality family on TimeBlind. PERTURBED arm:
# identical to the CD recipe (uniform k24, native resolution, timestamps on, task yesno,
# first-token yes/no logit masses logged) plus eval.perturb: blockshuffle — splits the selected frames
# into B consecutive blocks and permutes the blocks (within-block order kept), so local motion
# survives while the macro order is broken. A milder scramble than the full shuffle and a weaker
# negation than reverse/segswap — the low rung of the sibling-quality curve above shuffle. Timestamps
# stay ascending (labels no longer match the content). The REAL arm is the plain
# eagle_timeblind_calib.yaml (uniform-k24, no perturb; the same frames are selected deterministically
# before the block permutation). Decoded offline (scripts/contrastive_decode.py).

experiment:
  type: contrastive-decoding
  technique: video-perturbation-blockshuffle

model:
  kind: eagle
  checkpoint: nvidia/Eagle2.5-8B
  attn_implementation: sdpa

dataset:
  kind: timeblind
  root: /path/to/datasets/timeblind
  annotations: data.jsonl

video:
  frame_source: uniform
  candidates: 32
  top_k: 24
  candidate_resize: null
  max_dynamic_tiles: 1
  pass_timestamps: true
  fps: 8

prompt:
  task: yesno

generation:
  max_new_tokens: 8
  do_sample: false

eval:
  seed: 1234
  sample_timeout_s: 300
  results_dir: ../results
  log_yesno_logits: true
  perturb:
    mode: blockshuffle     # permute B consecutive blocks; within-block order kept; timestamps ascending
    blocks: 4              # number of consecutive blocks the k24 frames are split into
    seed: 1234             # per-item block permutation seed (mixed with the sample id, like shuffle)

wandb:
  project: vlm-benchmark
  group: contrastive-decoding
  name: eagle-tbblk-pert
  log_every: 50
